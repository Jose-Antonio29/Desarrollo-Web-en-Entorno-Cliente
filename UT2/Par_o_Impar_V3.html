<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par o Impar</title>
</head>
<body>
    <h1>Par o impar</h1>
    <p>Abre la consola para ver el resultado</p>

    <script>
        // Pedimos el valor
        let valor = prompt("Elige un número entero");

        // Comprobamos si se ha cancelado la introducción del valor
        if (valor === null) {
                // El usuario pulsa cancelar
                console.log("Operación cancelada por el usuario");
        } else {
            if (valor === "" || valor.trim() === "") {
                // Caso cadena vacía o cadena con espacios en blanco
                console.log("No has introducido ningún valor");
            } else {
                // Convertimos a número entero
                let num = Number(valor);
                
                if (Number.isInteger(num)) {
                    // Caso correcto -> Mostramos por consola par/impar
                    let tipo = (num%2 === 0)? "Par" : "Impar";
                    console.log("El número ", num, " es ", tipo);
                } else {
                    // Caso cadena no númerica
                    console.log("Debes introducir un número entero")
                }
            }
        }
    </script>
</body>
</html>
