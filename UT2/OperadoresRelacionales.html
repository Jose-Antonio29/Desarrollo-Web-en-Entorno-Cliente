<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Operadores Relacionales</title>
</head>
<body>
    <h1>Prueba con operadores relacionales</h1>
    <p>Abre la consola para ver los resultados</p>

    <script>
        // Definimos dos variables
        let a = 5;
        let b = 10;

        // Mostramos los valores y sus tipos
        console.log("a:", a, " (tipo:", typeof a + ")");
        console.log("b:", b, " (tipo:", typeof b + ")");

        // Ejemplos de operadores relacionales
        console.log("a == b: ", a == b);
        console.log("a === b: ", a === b);
        console.log("a != b: ", a != b);
        console.log("a !== b: ", a !== b);
        console.log("a > b: ", a > b);
        console.log("a < b: ", a < b);
        console.log("a >= b: ", a >= b);
        console.log("a <= b: ", a <= b);


        // Definimos dos variables
        a = 5;
        b = '5';

        // Mostramos los valores y sus tipos
        console.log("a:", a, " (tipo:", typeof a + ")");
        console.log("b:", b, " (tipo:", typeof b + ")");

        // Ejemplos de operadores relacionales
        console.log("a == b: ", a == b);
        console.log("a === b: ", a === b);
        console.log("a != b: ", a != b);
        console.log("a !== b: ", a !== b);
        console.log("a > b: ", a > b);
        console.log("a < b: ", a < b);
        console.log("a >= b: ", a >= b);
        console.log("a <= b: ", a <= b);
    </script>
</body>
</html>
