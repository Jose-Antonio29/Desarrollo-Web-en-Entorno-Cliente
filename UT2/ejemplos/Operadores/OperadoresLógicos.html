<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Prueba con operadores lógicos</h1>
    <p>Abre la consola para ver los resultados</p>

    <script>
        // Variables del ejemplo
        let a = true;
        let b = false;

        console.log("a: ", a);
        console.log("b: ", b);

        // AND lógico (&&) -> true si ambos son true
        console.log("a && b: ", a && b); 

        // OR lógico (||) -> true si al menos uno es true
        console.log("a || b: ", a || b);

        // NOT lógico (!) -> invierte el valor 
        console.log("!a: ", !a);
        console.log("!b: ", !b);
    </script>
</body>
</html>
