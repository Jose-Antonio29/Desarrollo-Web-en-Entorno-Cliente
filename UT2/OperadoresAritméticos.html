<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Operadores aritméticos</title>
</head>
<body>
    <h1>Prueba de operadores aritméticos</h1>
    <p>Abre la consola para ver los resultados</p>
    <script>
        console.log('1' + 2);               // '12'
        console.log(2 + '1');               // ''21

        console.log(Number('1') + 2);       // 3

        console.log(6 - '2');               // 4
        console.log('5' * 3);               // 15
        console.log('7' / '2');             // 3.5
        console.log(7 % '2');               // 1

        let s = '9';
        console.log(++s);                   // 10 (lo convierte a número)
    </script>
</body>
</html>
