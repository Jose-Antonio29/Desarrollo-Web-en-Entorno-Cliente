<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de multiplicar</title>
</head>
<body>
    <h1>Tabla de multiplicar</h1>
    <h3 id="titulo"></h3>
    <p id="tabla"></p>

    <script>
        let num = Number(prompt("Elige un número entero (1-10): "));

        if (isNaN(num)) {
            document.getElementById("titulo").textContent="Valor no válido";
        } else if (num < 1 || num > 10) {
            document.getElementById("titulo").textContent="Debes introducir un número entre 1 y 10";
        } else {
            let x = parseInt(num);
            document.getElementById("titulo").textContent=`Tabla del ${x}`;

            for (let i=1; i<=10; i++) {
                document.getElementById("tabla").innerHTML+=`${x}x${i} = ${x*i}<br>`;
            }

        }
    </script>
</body>
</html>
