<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par o Impar</title>
</head>
<body>
    <h1>Par o impar</h1>
    <p>Abre la consola para ver el resultado</p>

    <script>
        // Pedimos el valor
        let valor = prompt("Elige un número entero");

        // Comprobamos si se ha cancelado la introducción del valor
        if (valor === null) {
                // El usuario pulsa cancelar
                console.log("Operación cancelada por el usuario");
        } else {
            // Convertimos a número entero
            let num = parseInt(valor);
            
            if (isNaN(num)) {
                // Caso cadena no númerica
                console.log("Debes introducir un número entero")
            } else {
                // Caso correcto -> Mostramos por consola si el número es par o impar
                let tipo = (num%2 === 0)? "Par" : "Impar";
                console.log("El número ", num, " es ", tipo);
            }
        }
    </script>
</body>
</html>
