<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios UT2</title>
</head>
<body>
    <h1>Ejercicios operadores</h1>
    <p>Abre la consola para ver los resultados</p>

    <script>
        // Declaramos variables
        let a = 8;
        let b = 12;

        console.log("a <= b: ", a <= b);                                                // true
        console.log("a != b: ", a != b);                                                // true
        console.log("a > 5 && a <10: ", a > 5 && a < 10);                               // true
        console.log("b > 10 || a < 5: ", b > 10 || a < 5);                              // true
        console.log("a % 2 == 0 && b % 2 != 0: ", a % 2 == 0 && b % 2 != 0 );           // false
        console.log("a + b > 20 && a < b: ", (a + b) > 20 && a < b);                    // false
        console.log("0 >= a <= 10 || b == 12: ", 0 >= a <= 10 || b == 12);              // true
        console.log("a % 4 == 0 && b % 5 != 0", a % 4 == 0 && b % 5 != 0);              // true
        console.log("a > b || b >= 12: ", a > b || b >= 12);                            // true
        console.log("a * 2 > b * 3: ", (a * 2) > (b * 3));                              // false
    </script>
</body>
</html>
